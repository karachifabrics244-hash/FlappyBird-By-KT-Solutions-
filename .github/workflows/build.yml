name: Build Android APK
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Tools
      run: |
        pip install --upgrade pip
        pip install buildozer cython
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libsqlite3-dev libgdbm-dev libssl-dev libbzip2-dev libreadline-dev libffi-dev libgstreamer1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good

    - name: Init and Build
      run: |
        yes | buildozer init
        sed -i 's/requirements = python3,kivy/requirements = python3,pygame/g' buildozer.spec
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: FlappyBird-APK
        path: bin/*.apk
        
